# Example reverse proxy for a Linux server after npm run build.
# Update server_name, root and TLS certificates before production use.
# Apply HTTPS/TLS and secure cookies for any public deployment.
server {
    listen 80;
    server_name ranches.example.com;
    root /var/www/cape-ranch/frontend/dist;
    index index.html;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    # Other app assets are served from their original /frontend/... paths.
    location /frontend/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.(?:html|js|css)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
